workflows:
  android-workflow:
    name: Android APK
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      flutter: stable
    scripts:
      - name: Create project
        script: |
          flutter clean
          flutter create . --platforms=android --project-name=my_8k_camera --overwrite
          cp my_camera_app/lib/main.dart lib/main.dart
          cp my_camera_app/pubspec.yaml pubspec.yaml
          flutter pub get
          chmod +x android/gradlew
          ls android/
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
