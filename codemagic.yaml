workflows:
  android-workflow:
    name: Killer Top Build
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.5
      java: 17
    scripts:
      - name: Fix Old Gradle Project
        script: |
          rm -rf android
          flutter create . --platforms=android --project-name my_8k_camera
          flutter pub get
          
      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
