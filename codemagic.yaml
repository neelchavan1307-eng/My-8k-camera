workflows:
  android-8k:
    name: Build 8K Camera APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Create project
        script: |
          echo "include ':app'" > settings.gradle
          printf "buildscript{repositories{google();mavenCentral()} dependencies{classpath 'com.android.tools.build:gradle:8.2.2'}} allprojects{repositories{google();mavenCentral()}}" > build.gradle
          mkdir -p app/src/main/java/com/neel/my8kcamera app/src/main/res/layout app/src/main/res/values
          printf "plugins{id 'com.android.application'}\nandroid{namespace 'com.neel.my8kcamera'; compileSdk 34; defaultConfig{applicationId 'com.neel.my8kcamera'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0'} buildTypes{release{minifyEnabled false}} compileOptions{sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8}}\ndependencies{implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'androidx.camera:camera-camera2:1.3.4'; implementation 'androidx.camera:camera-lifecycle:1.3.4'; implementation 'androidx.camera:camera-view:1.3.4'}" > app/build.gradle
          printf "<manifest xmlns:android='http://schemas.android.com/apk/res/android'><uses-permission android:name='android.permission.CAMERA'/><uses-permission android:name='android.permission.RECORD_AUDIO'/><application android:label='My 8K Camera' android:theme='@android:style/Theme.NoTitleBar.Fullscreen'><activity android:name='.MainActivity' android:exported='true'><intent-filter><action android:name='android.intent.action.MAIN'/><category android:name='android.intent.category.LAUNCHER'/></intent-filter></activity></application></manifest>" > app/src/main/AndroidManifest.xml
          echo '<resources><string name="app_name">My 8K Camera</string></resources>' > app/src/main/res/values/strings.xml
          printf "<?xml version='1.0' encoding='utf-8'?><FrameLayout xmlns:android='http://schemas.android.com/apk/res/android' android:layout_width='match_parent' android:layout_height='match_parent'><androidx.camera.view.PreviewView android:id='@+id/previewView' android:layout_width='match_parent' android:layout_height='match_parent'/><Button android:id='@+id/btnRecord' android:layout_width='80dp' android:layout_height='80dp' android:text='REC' android:layout_gravity='bottom|center'/></FrameLayout>" > app/src/main/res/layout/activity_main.xml
          printf "package com.neel.my8kcamera; import android.Manifest; import android.os.Bundle; import androidx.appcompat.app.AppCompatActivity; import androidx.camera.core.*; import androidx.camera.lifecycle.ProcessCameraProvider; import androidx.camera.view.PreviewView; import androidx.core.app.ActivityCompat; import androidx.core.content.ContextCompat; import com.google.common.util.concurrent.ListenableFuture; public class MainActivity extends AppCompatActivity{PreviewView pv; public void onCreate(Bundle b){super.onCreate(b); setContentView(R.layout.activity_main); pv=findViewById(R.id.previewView); ActivityCompat.requestPermissions(this,new String[]{Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO},10); ListenableFuture<ProcessCameraProvider> f=ProcessCameraProvider.getInstance(this); f.addListener(()->{try{ProcessCameraProvider p=f.get(); Preview pr=new Preview.Builder().build(); pr.setSurfaceProvider(pv.getSurfaceProvider()); p.unbindAll(); p.bindToLifecycle(this, CameraSelector.DEFAULT_BACK_CAMERA, pr);}catch(Exception e){}}, ContextCompat.getMainExecutor(this));}}" > app/src/main/java/com/neel/my8kcamera/MainActivity.java
      - name: Build APK
        script: |
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
