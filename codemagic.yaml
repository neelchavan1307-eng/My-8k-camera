workflows:
  android-8k:
    name: Android Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Check files
        script: |
          pwd
          ls -la
          ls -la my_camera_app
          cat my_camera_app/pubspec.yaml
      - name: Get packages
        working_directory: my_camera_app
        script: flutter pub get
      - name: Build APK
        working_directory: my_camera_app
        script: flutter build apk --release
    artifacts:
      - my_camera_app/build/app/outputs/flutter-apk/app-release.apk
