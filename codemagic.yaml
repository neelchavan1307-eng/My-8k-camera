workflows:
  android-workflow:
    name: Build 8K Camera APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Fix all to SDK 34
        script: |
          flutter create . --platforms=android --project-name my_8k_camera
          flutter pub get
          printf "subprojects{afterEvaluate{p->if(p.hasProperty('android')){p.android{compileSdkVersion 34}}}}\n" >> android/build.gradle
          echo "flutter.compileSdkVersion=34" > android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties
          dart run flutter_launcher_icons
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
