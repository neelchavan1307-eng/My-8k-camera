workflows:
  android-workflow:
    name: Killer Camera Top
    instance_type: mac_mini_m2
    environment:
      flutter: 3.27.4
      java: 17
    scripts:
      - name: Clean Fix
        script: |
          rm -rf android
          flutter create. --platforms=android --project-name my_8k_camera
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
