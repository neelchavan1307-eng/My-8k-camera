workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.3
       java: 17
        scripts:
       - name: Fix project
            script: |
              flutter clean
              rm -rf android
              flutter create . --platforms=android --org com.example.my8kcamera
              flutter pub get
      - name: Build APK
          script: |
              flutter build apk --release --no-tree-shake-icons
    artifacts:
       - build/app/outputs/flutter-apk/*.apk
