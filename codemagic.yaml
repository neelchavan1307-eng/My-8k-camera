workflows:
  android-workflow:
    name: Build 8K Camera APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Create project and patch GAL
        script: |
          flutter create . --platforms=android --project-name my_8k_camera
          flutter pub get
          echo "flutter.compileSdkVersion=34" > android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties
          echo "flutter.minSdkVersion=23" >> android/local.properties
          sed -i.bak "s/flutter.compileSdkVersion/34/g" android/app/build.gradle
          sed -i.bak "s/flutter.targetSdkVersion/34/g" android/app/build.gradle
          find $HOME/.pub-cache -name build.gradle -exec sed -i.bak "s/33/34/g" {} \;
          dart run flutter_launcher_icons
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
