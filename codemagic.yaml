workflows:
  android-workflow:
    name: Build 8K Camera APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Create project and patch GAL
        script: |
          rm -rf android
          flutter create . --platforms=android --project-name my_8k_camera
          flutter pub get
          
          # Fix for both old and new Gradle file
          if [ -f "android/app/build.gradle" ]; then
            sed -i.bak "s/flutter.compileSdkVersion=.*/flutter.compileSdkVersion=34/" android/app/build.gradle || true
            sed -i.bak "s/flutter.targetSdkVersion=.*/flutter.targetSdkVersion=34/" android/app/build.gradle || true
            sed -i.bak "s/compileSdk.*/compileSdk 34/" android/app/build.gradle || true
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i.bak "s/compileSdk.*/compileSdk = 34/" android/app/build.gradle.kts || true
          fi
          echo "flutter.compileSdkVersion=34" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties
          
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
